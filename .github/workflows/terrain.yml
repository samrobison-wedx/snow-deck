name: Update terrain status
on:
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: save-data-terrain
  cancel-in-progress: false
jobs:
  update:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser (for resort pages that load their numbers by script)
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Collect lifts and trails
        run: python scripts/terrain.py
      - name: Save data
        run: |
          git config user.name "snow-deck-bot"
          git config user.email "snow-deck-bot@users.noreply.github.com"
          mkdir -p data
          git add data/terrain.json
          git diff --cached --quiet && exit 0
          git commit -m "Update terrain status"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            cp data/terrain.json "$RUNNER_TEMP/keep.json"
            git reset --hard origin/main
            mkdir -p data
            cp "$RUNNER_TEMP/keep.json" data/terrain.json
            git add data/terrain.json
            git diff --cached --quiet && exit 0
            git commit -m "Update terrain status"
          done
          exit 1
 
