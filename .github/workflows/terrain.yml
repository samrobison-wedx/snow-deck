name: Update terrain status
on:
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect lifts and trails
        run: python scripts/terrain.py
      - name: Save data
        run: |
          git config user.name "snow-deck-bot"
          git config user.email "snow-deck-bot@users.noreply.github.com"
          git add data/terrain.json
          git diff --cached --quiet || (git commit -m "Update terrain status" && git pull --rebase origin main && git push)
 
