name: Update terrain status
on:
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: save-data-terrain
  cancel-in-progress: false
jobs:
  update:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser (for resort pages that load their numbers by script)
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Collect lifts and trails
        run: python scripts/terrain.py
      - name: Collect opening dates
        continue-on-error: true
        run: python scripts/opening.py
      - name: Collect notices and season snowfall
        continue-on-error: true
        run: python scripts/notices.py
      - name: Collect road reports (needs free API keys; skipped without them)
        continue-on-error: true
        env:
          COTRIP_API_KEY: ${{ secrets.COTRIP_API_KEY }}
          UDOT_API_KEY: ${{ secrets.UDOT_API_KEY }}
        run: python scripts/roads.py
      - name: Save data
        if: always()
        run: |
          git config user.name "snow-deck-bot"
          git config user.email "snow-deck-bot@users.noreply.github.com"
          mkdir -p data
          git add data/terrain.json
          [ -f data/opening.json ] && git add data/opening.json || true
          [ -f data/notices.json ] && git add data/notices.json || true
          [ -f data/roads.json ] && git add data/roads.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Update terrain status"
          for i in 1 2 3 4 5 6 7 8; do
            if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
 
