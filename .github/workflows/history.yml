name: Update history
on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: save-data-history
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snow history
        run: python scripts/history.py
      - name: Fill in past avalanche ratings
        continue-on-error: true
        run: python scripts/avy_backfill.py
      - name: Save data
        run: |
          git config user.name "snow-deck-bot"
          git config user.email "snow-deck-bot@users.noreply.github.com"
          FILES="data/history.json data/avy-archive.json"
          mkdir -p data
          for i in 1 2 3 4 5; do
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            git diff --cached --quiet && exit 0
            git commit -m "Update history"
            git push && exit 0
            git fetch origin main
            mkdir -p "$RUNNER_TEMP/keep"
            for f in $FILES; do [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/keep/$(basename $f)"; done
            git reset --hard origin/main
            mkdir -p data
            for f in $FILES; do [ -f "$RUNNER_TEMP/keep/$(basename $f)" ] && cp "$RUNNER_TEMP/keep/$(basename $f)" "$f"; done
          done
          exit 1
 
